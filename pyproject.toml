[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-bash-agent"
version = "0.1.0"
description = "A terminal agent that uses Azure OpenAI and an approved Bash tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25,<2",
    "openai>=1.106,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
azure-bash-agent = "azure_bash_agent.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["azure_bash_agent"]
mypy_path = "src"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_bash_agent"]
